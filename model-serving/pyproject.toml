[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-model-serving"
version = "0.0.0"
description = "GPU-bound inference deployable (RFC §9.2/§9.6): embeddings, liveness/anti-spoof, deepfake/voice-clone classifiers, ASR. M8 serving API stood up behind stub extractors/detectors; real models are not trained/loaded here."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "UNLICENSED" }
dependencies = [
  "pydantic-settings>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "insightface>=0.7.3,<1",
  "onnxruntime>=1.19,<2",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2.1,<3",
  "torch>=2.4,<3",
  "torchaudio>=2.4,<3",
  "speechbrain>=1.0,<2",
  "pyannote.audio>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["model_serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
