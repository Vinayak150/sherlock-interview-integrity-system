[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-model-serving"
version = "0.0.0"
description = "GPU-bound inference deployable (RFC §9.2/§9.6): embeddings, liveness/anti-spoof, deepfake/voice-clone classifiers, ASR. M0 scaffold only — no models are loaded or served yet."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "UNLICENSED" }
dependencies = [
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["model_serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
