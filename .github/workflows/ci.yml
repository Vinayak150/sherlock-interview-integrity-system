name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typescript:
    name: TypeScript (contracts, orchestrator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  python:
    name: Python (model-serving)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-serving
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Build orchestrator image
        run: docker build -f orchestrator/Dockerfile -t sherlock-orchestrator:ci .

      - name: Build model-serving image
        run: docker build -f model-serving/Dockerfile -t sherlock-model-serving:ci model-serving

      - name: Validate docker-compose config
        run: docker compose config
