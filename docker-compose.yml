# Local development topology.
#
# Mirrors the RFC's stated service topology (§9.2/§9.6): one orchestrator
# deployable, one model-serving deployable, one relational database
# (Evidence Store, §9.3/ADR-7), and one lightweight KV store (Session
# Registry, §9.4/ADR-8).
#
# postgres: schema is applied explicitly via `make migrate` (M1) — not
# automatically on container start — so applying a migration is always a
# deliberate, observable step.
# redis: provisioned for the Session Registry; no routing logic runs
# against it yet (see M7).
name: sherlock

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sherlock}
      POSTGRES_USER: ${POSTGRES_USER:-sherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherlock_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sherlock}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-sherlock}
      POSTGRES_USER: ${POSTGRES_USER:-sherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherlock_dev_password}
    command: ['npm', 'run', 'migrate', '--workspace=@sherlock/orchestrator']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Evidence Store (§9.3/ADR-7): the container-network hostname, not
      # localhost — orchestrator and postgres are separate containers here.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-sherlock}
      POSTGRES_USER: ${POSTGRES_USER:-sherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherlock_dev_password}
      REDIS_URL: redis://redis:6379
      MODEL_SERVING_URL: http://model-serving:8081
      ORCHESTRATOR_HTTP_PORT: '8080'
      ORCHESTRATOR_HTTP_HOST: '0.0.0.0'
    ports:
      - '${ORCHESTRATOR_HTTP_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-serving:
        condition: service_started

  model-serving:
    build:
      context: model-serving
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_SERVING_LOG_LEVEL: ${MODEL_SERVING_LOG_LEVEL:-info}
      MODEL_SERVING_HTTP_PORT: '8081'
      MODEL_SERVING_HTTP_HOST: '0.0.0.0'
    ports:
      - '${MODEL_SERVING_HTTP_PORT:-8081}:8081'

volumes:
  postgres-data:
