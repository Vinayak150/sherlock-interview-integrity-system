# Local development topology for M0.
#
# Mirrors the RFC's stated service topology (§9.2/§9.6): one orchestrator
# deployable, one model-serving deployable, one relational database
# (Evidence Store, §9.3/ADR-7), and one lightweight KV store (Session
# Registry, §9.4/ADR-8). No schema/migrations run against postgres and no
# routing logic runs against redis in M0 -- they are provisioned here only
# so later milestones (M1, M7) have infrastructure to build against.
name: sherlock

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sherlock}
      POSTGRES_USER: ${POSTGRES_USER:-sherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherlock_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sherlock}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  model-serving:
    build:
      context: model-serving
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_SERVING_LOG_LEVEL: ${MODEL_SERVING_LOG_LEVEL:-info}

volumes:
  postgres-data:
